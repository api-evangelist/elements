description: >-
  Stoplight Elements is an open-source API documentation component library for rendering OpenAPI specifications
  interactively. It provides embeddable React and Web Components that produce beautiful, interactive API reference
  documentation from any OpenAPI 2.0, 3.0, or 3.1 document, with support for a Try It console, code sample generation,
  sidebar and stacked layouts, and internal operation filtering.
